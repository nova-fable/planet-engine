name: Deploy to GitHub Pages

# 推送到 master 即自动测试、构建并发布到 GitHub Pages。
#
# 采用 artifact 部署方式（actions/deploy-pages）：
#   · 不需要 gh-pages 分支，产物作为 Actions artifact 直接发布
#   · 源码与产物分离，tests/ 等开发文件不会暴露到线上
#   · 避免了「Action 推到 gh-pages、Pages 却读 master」的分支错位问题
#
# 也可在 Actions 页面手动触发（workflow_dispatch）。
on:
  push:
    branches: [master]
  workflow_dispatch:

# Pages 部署所需权限：
#   contents: read  —— 读取仓库内容
#   pages: write    —— 发布到 Pages
#   id-token: write —— OIDC 令牌，供 deploy-pages 校验来源
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署；新的推送取消进行中的旧任务。
# 注意：不要对部署任务使用 cancel-in-progress，否则可能中断正在进行的发布。
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 1. 质量门禁：两套测试必须全绿，否则不部署 ──
  test:
    name: 运行测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 数据契约测试
        run: node tests/contracts.test.mjs

      - name: 装配与几何测试
        run: node tests/test-assembly.mjs

      - name: 校验 vendor 导入图完整
        run: |
          node -e "
          const fs = require('fs');
          let bad = 0;
          for (const f of fs.readdirSync('vendor/addons')) {
            const src = fs.readFileSync('vendor/addons/' + f, 'utf8');
            const unresolved = [...src.matchAll(/from '([^']+)'/g)].map(m => m[1])
              .filter(p => p !== '../three.module.js' && !fs.existsSync('vendor/addons/' + p.replace('./', '')));
            if (unresolved.length) { console.log('未解析的导入:', f, unresolved); bad++; }
          }
          if (bad) process.exit(1);
          console.log('vendor 导入图完整');
          "

  # ── 2. 构建：本项目零构建，仅做产物校验与打包 ──
  build:
    name: 构建产物
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 校验入口文件存在
        run: |
          set -e
          for f in index.html src/main.js vendor/three.module.js; do
            test -f "$f" || { echo "缺少必需文件: $f"; exit 1; }
          done
          echo "入口文件校验通过"

      - name: 打包站点产物
        run: |
          set -e
          mkdir -p _site
          # 只发布运行页面真正需要的文件，排除 tests/ 与开发脚本
          cp -R index.html favicon.svg src vendor _site/
          # 自定义域名与 Jekyll 开关
          echo "planet-engine.zxinrun.cn" > _site/CNAME
          touch _site/.nojekyll
          echo "--- 产物清单 ---"
          find _site -type f | sort
          echo "--- 产物体积 ---"
          du -sh _site

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # ── 3. 部署：发布到 GitHub Pages ──
  deploy:
    name: 发布到 GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 部署摘要
        run: |
          {
            echo "## 部署完成"
            echo ""
            echo "- 提交：\`${{ github.sha }}\`"
            echo "- 站点：${{ steps.deployment.outputs.page_url }}"
            echo "- 域名：https://planet-engine.zxinrun.cn"
            echo ""
            echo "> 采用 artifact 部署方式，不再使用 gh-pages 分支。"
          } >> "$GITHUB_STEP_SUMMARY"
